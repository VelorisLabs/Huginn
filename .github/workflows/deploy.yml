name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # 支持手动触发

# 同一时间只允许一个部署任务运行，后来的排队
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            echo "🚀 开始部署 Huginn..."
            cd /opt/huginn

            # 清理上次可能残留的 nginx 容器（端口冲突修复）
            docker rm -f huginn-nginx 2>/dev/null || true

            # 拉取最新代码
            echo "📥 拉取代码..."
            git fetch origin main
            git reset --hard origin/main

            # ===== 后端：重建 Docker 容器 =====
            echo "🔨 重建后端容器..."
            cd deploy
            docker compose up -d --build --remove-orphans

            # 等待健康检查
            echo "🏥 等待后端启动..."
            sleep 5
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ 后端服务健康！"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "❌ 健康检查超时"
                docker compose logs --tail=30 backend
                exit 1
              fi
              echo "⏳ 等待中... ($i/12)"
              sleep 5
            done

            # ===== 前端：构建静态文件 =====
            echo "🔨 构建前端..."
            cd /opt/huginn
            docker build -f deploy/Dockerfile.nginx --target frontend-builder -t huginn-frontend-build .
            docker rm -f huginn-frontend-temp 2>/dev/null || true
            docker create --name huginn-frontend-temp huginn-frontend-build
            rm -rf /var/www/huginn
            mkdir -p /var/www/huginn
            docker cp huginn-frontend-temp:/app/dist/. /var/www/huginn/
            docker rm huginn-frontend-temp
            echo "✅ 前端文件已部署到 /var/www/huginn"

            # 重载宿主机 Nginx
            echo "🔄 重载 Nginx..."
            nginx -t && systemctl reload nginx

            # 清理旧镜像
            echo "🧹 清理..."
            docker image prune -f

            echo "🎉 部署完成！"
