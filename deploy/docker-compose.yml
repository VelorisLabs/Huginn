version: '3.8'

services:
  # Redis - 任务队列
  redis:
    image: redis:7-alpine
    container_name: paper-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 后端 API
  backend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.backend
    container_name: paper-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/paper_analysis.db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker
  celery:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.backend
    container_name: paper-celery
    restart: unless-stopped
    command: celery -A api.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/paper_analysis.db
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

  # 前端
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: paper-frontend
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      - PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  # Nginx 反向代理（生产环境）
  nginx:
    image: nginx:alpine
    container_name: paper-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    profiles:
      - production

volumes:
  redis_data:
  backend_data:
  backend_uploads:
  nginx_logs:
