version: '3.8'

services:
  # 后端 API (FastAPI + uvicorn)
  backend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.backend
    container_name: huginn-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/paper_analysis.db
      - SECRET_KEY=${SECRET_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180.0}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["https://huginn.velorislab.com"]}
      - COOKIE_SECURE=true
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理 + 前端静态文件
  nginx:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.nginx
    container_name: huginn-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_uploads:
  nginx_logs:
